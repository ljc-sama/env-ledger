[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-ledger"
version = "0.1.0"
description = "Download files and keep a hash-verifiable ledger"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ljc-sama" }]
keywords = ["download", "sha256", "ledger", "cli", "provenance"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
env-ledger = "env_ledger.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
